name: TaskBoard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # --------------------------------
  # 1. Backend CI
  # --------------------------------
  backend-check:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend

  # --------------------------------
  # 2. Frontend CI
  # --------------------------------
  frontend-check:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # --------------------------------
  # 3. Docker Build and Trivy Scan
  # --------------------------------
  docker-build:
    name: Docker Build and Security Scan
    needs:
      - backend-check
      - frontend-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: taskboard-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: taskboard-frontend:ci

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskboard-backend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskboard-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  # --------------------------------
  # 4. Publish Docker Images to AWS ECR
  # --------------------------------
  publish-ecr:
    name: Publish Docker Images to AWS ECR
    needs:
      - backend-check
      - frontend-check
      - docker-build

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::570220875724:role/TaskBoardGitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t taskboard-backend:latest ./backend

          docker tag taskboard-backend:latest $ECR_REGISTRY/taskboard-backend:latest
          docker tag taskboard-backend:latest $ECR_REGISTRY/taskboard-backend:$IMAGE_TAG

          docker push $ECR_REGISTRY/taskboard-backend:latest
          docker push $ECR_REGISTRY/taskboard-backend:$IMAGE_TAG

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t taskboard-frontend:latest ./frontend

          docker tag taskboard-frontend:latest $ECR_REGISTRY/taskboard-frontend:latest
          docker tag taskboard-frontend:latest $ECR_REGISTRY/taskboard-frontend:$IMAGE_TAG

          docker push $ECR_REGISTRY/taskboard-frontend:latest
          docker push $ECR_REGISTRY/taskboard-frontend:$IMAGE_TAG

  # --------------------------------
  # 5. Automatic Deployment to EC2
  # --------------------------------
  deploy-ec2:
    name: Deploy TaskBoard to EC2
    needs: publish-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::570220875724:role/TaskBoardGitHubActionsRole
          aws-region: us-east-1

      - name: Deploy using AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0cdcb26d95a1f9c1f \
            --document-name AWS-RunShellScript \
            --comment "Deploy TaskBoard from GitHub Actions" \
            --parameters 'commands=["set -e","cd /home/ec2-user/taskboard","aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 570220875724.dkr.ecr.us-east-1.amazonaws.com","docker compose pull","docker compose up -d --remove-orphans","docker compose ps"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0cdcb26d95a1f9c1f \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0cdcb26d95a1f9c1f \
                --query "StandardOutputContent" \
                --output text

              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0cdcb26d95a1f9c1f \
                --output json

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out. Check AWS Systems Manager."
          exit 1
